<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillInterview - Bookmarks</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body data-theme="light">
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="sidebar-brand">
                    <i class="bi bi-code-slash me-2"></i>SkillInterview
                </a>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item"><i class="bi bi-house-door"></i> Home</a>
                <a href="categories.html?cat=python.json" class="nav-item"><i class="bi bi-folder2-open"></i> Categories</a>
                <a href="practice.html" class="nav-item"><i class="bi bi-controller"></i> Practice</a>
                <a href="bookmarks.html" class="nav-item active"><i class="bi bi-bookmarks"></i> Bookmarks</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Header -->
            <header class="top-header">
                <button class="sidebar-toggle-btn" id="sidebarToggle">
                    <i class="bi bi-list"></i>
                </button>
                <div class="search-wrapper m-0 mx-3 flex-grow-1" style="max-width: 400px;">
                    <i class="bi bi-search search-icon"></i>
                    <input type="text" class="search-input" id="globalSearch" placeholder="Search across all categories...">
                </div>
                <div class="ms-auto d-flex align-items-center">
                    <button class="theme-toggle-btn" id="themeToggle" title="Toggle Dark Mode">
                        <i class="bi bi-moon"></i>
                    </button>
                </div>
            </header>

            <section class="container px-4 py-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold m-0">Your Bookmarks</h2>
                    <button class="btn btn-outline-danger btn-sm" onclick="clearBookmarks()">
                        <i class="bi bi-trash"></i> Clear All
                    </button>
                </div>
                
                <div id="bookmarksContainer">
                    <!-- Bookmarked questions load here -->
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="assets/js/darkmode.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/bookmarks.js"></script>
    <script src="assets/js/loader.js"></script>
    <script src="assets/js/search.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderBookmarks();
        });

        // We override the global bookmark handler here to also remove the card from the UI
        const originalHandleBookmark = window.DataLoader.handleBookmark;
        window.DataLoader.handleBookmark = function(btnElement, encodedQuestion) {
            originalHandleBookmark.call(this, btnElement, encodedQuestion);
            // Re-render after a slight delay to allow animation or immediate removal
            setTimeout(renderBookmarks, 300);
        };

        function renderBookmarks() {
            const container = document.getElementById('bookmarksContainer');
            const bookmarks = BookmarkManager.getBookmarks();
            
            if (bookmarks.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-5">
                        <i class="bi bi-bookmarks text-muted mb-3" style="font-size: 3rem;"></i>
                        <h4 class="text-muted">No bookmarks yet</h4>
                        <p class="text-muted">Questions you save will appear here.</p>
                        <a href="categories.html?cat=python.json" class="btn btn-primary mt-2">Start Exploring</a>
                    </div>
                `;
                return;
            }

            const html = bookmarks.map(q => window.DataLoader.renderQuestion(q)).join('');
            container.innerHTML = html;
        }

        function clearBookmarks() {
            if(confirm("Are you sure you want to clear all bookmarks?")) {
                localStorage.removeItem('skillinterview_bookmarks');
                renderBookmarks();
            }
        }
    </script>
</body>
</html>
