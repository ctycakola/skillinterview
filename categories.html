<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillInterview - Categories</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body data-theme="light">
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="sidebar-brand">
                    <i class="bi bi-code-slash me-2"></i>SkillInterview
                </a>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item"><i class="bi bi-house-door"></i> Home</a>
                <a href="categories.html?cat=python.json" class="nav-item active" id="sidebar-cat-python"><i class="bi bi-filetype-py"></i> Python</a>
                <a href="categories.html?cat=aws.json" class="nav-item" id="sidebar-cat-aws"><i class="bi bi-cloud-arrow-up"></i> AWS</a>
                <a href="categories.html?cat=rag.json" class="nav-item" id="sidebar-cat-rag"><i class="bi bi-database-gear"></i> RAG</a>
                <a href="categories.html?cat=sql.json" class="nav-item" id="sidebar-cat-sql"><i class="bi bi-server"></i> SQL</a>
                <a href="categories.html?cat=docker.json" class="nav-item" id="sidebar-cat-docker"><i class="bi bi-box-seam"></i> Docker</a>
                <a href="categories.html?cat=linux.json" class="nav-item" id="sidebar-cat-linux"><i class="bi bi-terminal"></i> Linux</a>
                <a href="categories.html?cat=systemdesign.json" class="nav-item" id="sidebar-cat-systemdesign"><i class="bi bi-diagram-3"></i> System Design</a>
                <a href="categories.html?cat=ml.json" class="nav-item" id="sidebar-cat-ml"><i class="bi bi-cpu"></i> Machine Learning</a>
                <a href="categories.html?cat=genai.json" class="nav-item" id="sidebar-cat-genai"><i class="bi bi-robot"></i> GenAI</a>
                <hr class="mx-3 my-2 border-secondary">
                <a href="practice.html" class="nav-item"><i class="bi bi-controller"></i> Practice</a>
                <a href="bookmarks.html" class="nav-item"><i class="bi bi-bookmarks"></i> Bookmarks</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Header -->
            <header class="top-header">
                <button class="sidebar-toggle-btn" id="sidebarToggle">
                    <i class="bi bi-list"></i>
                </button>
                <div class="search-wrapper m-0 mx-3 flex-grow-1" style="max-width: 400px;">
                    <i class="bi bi-search search-icon"></i>
                    <input type="text" class="search-input" id="categorySearch" placeholder="Filter questions...">
                </div>
                <div class="ms-auto d-flex align-items-center">
                    <button class="theme-toggle-btn" id="themeToggle" title="Toggle Dark Mode">
                        <i class="bi bi-moon"></i>
                    </button>
                </div>
            </header>

            <section class="container px-4 py-4">
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                    <h2 class="fw-bold m-0" id="categoryTitle">Loading...</h2>
                    
                    <div class="btn-group" role="group" aria-label="Difficulty Filter" id="difficultyFilter">
                        <input type="radio" class="btn-check" name="diffFilter" id="diffAll" autocomplete="off" value="all" checked>
                        <label class="btn btn-outline-primary" for="diffAll">All</label>

                        <input type="radio" class="btn-check" name="diffFilter" id="diffBeginner" autocomplete="off" value="beginner">
                        <label class="btn btn-outline-success" for="diffBeginner">Beginner</label>

                        <input type="radio" class="btn-check" name="diffFilter" id="diffIntermediate" autocomplete="off" value="intermediate">
                        <label class="btn btn-outline-warning" for="diffIntermediate">Intermediate</label>

                        <input type="radio" class="btn-check" name="diffFilter" id="diffAdvanced" autocomplete="off" value="advanced">
                        <label class="btn btn-outline-danger" for="diffAdvanced">Advanced</label>
                    </div>
                </div>

                <div id="questionsContainer">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="assets/js/darkmode.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/bookmarks.js"></script>
    <script src="assets/js/loader.js"></script>
    <script src="assets/js/search.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const categoryFile = urlParams.get('cat');
            const searchQuery = urlParams.get('search');
            
            const titleEl = document.getElementById('categoryTitle');
            const container = document.getElementById('questionsContainer');
            
            let questions = [];

            if (searchQuery) {
                // Handle global search
                titleEl.textContent = `Search Results: "${searchQuery}"`;
                questions = await SearchManager.searchAll(searchQuery);
            } else if (categoryFile) {
                // Handle category load
                const catName = categoryFile.replace('.json', '');
                // Highlight sidebar
                const sidebarItem = document.getElementById(`sidebar-cat-${catName}`);
                if(sidebarItem) {
                    document.querySelectorAll('.sidebar-nav .nav-item').forEach(el => el.classList.remove('active'));
                    sidebarItem.classList.add('active');
                }
                
                titleEl.textContent = catName.charAt(0).toUpperCase() + catName.slice(1) + ' Interview Questions';
                questions = await DataLoader.loadCategory(categoryFile);
                localStorage.setItem('skillinterview_last_category', categoryFile);
            } else {
                titleEl.textContent = 'Please select a category from the sidebar.';
                container.innerHTML = '';
                return;
            }

            renderQuestions(questions);

            // Setup filters
            document.querySelectorAll('input[name="diffFilter"]').forEach(radio => {
                radio.addEventListener('change', (e) => {
                    const diff = e.target.value;
                    const query = document.getElementById('categorySearch').value.toLowerCase();
                    filterAndRender(questions, diff, query);
                });
            });

            // Setup local search
            const catSearch = document.getElementById('categorySearch');
            if(catSearch) {
                catSearch.addEventListener('input', (e) => {
                    const diff = document.querySelector('input[name="diffFilter"]:checked').value;
                    const query = e.target.value.toLowerCase();
                    filterAndRender(questions, diff, query);
                });
            }

            function filterAndRender(data, difficulty, query) {
                let filtered = data;
                
                if (difficulty !== 'all') {
                    filtered = filtered.filter(q => q.difficulty.toLowerCase() === difficulty);
                }
                
                if (query) {
                    filtered = filtered.filter(q => 
                        q.question.toLowerCase().includes(query) || 
                        q.answer.toLowerCase().includes(query) ||
                        (q.topic && q.topic.toLowerCase().includes(query))
                    );
                }
                
                renderQuestions(filtered);
            }

            function renderQuestions(data) {
                if(data.length === 0) {
                    container.innerHTML = '<div class="alert alert-info">No questions found matching your criteria.</div>';
                    return;
                }
                const html = data.map(q => DataLoader.renderQuestion(q)).join('');
                container.innerHTML = html;
            }
        });
    </script>
</body>
</html>
