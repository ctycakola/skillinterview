<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillInterview - Practice</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body data-theme="light">
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="sidebar-brand">
                    <i class="bi bi-code-slash me-2"></i>SkillInterview
                </a>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item"><i class="bi bi-house-door"></i> Home</a>
                <a href="categories.html?cat=python.json" class="nav-item"><i class="bi bi-folder2-open"></i> Categories</a>
                <a href="practice.html" class="nav-item active"><i class="bi bi-controller"></i> Practice</a>
                <a href="bookmarks.html" class="nav-item"><i class="bi bi-bookmarks"></i> Bookmarks</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Header -->
            <header class="top-header">
                <button class="sidebar-toggle-btn" id="sidebarToggle">
                    <i class="bi bi-list"></i>
                </button>
                <div class="search-wrapper m-0 mx-3 flex-grow-1" style="max-width: 400px;">
                    <i class="bi bi-search search-icon"></i>
                    <input type="text" class="search-input" id="globalSearch" placeholder="Search across all categories...">
                </div>
                <div class="ms-auto d-flex align-items-center">
                    <button class="theme-toggle-btn" id="themeToggle" title="Toggle Dark Mode">
                        <i class="bi bi-moon"></i>
                    </button>
                </div>
            </header>

            <section class="container px-4 py-4">
                <h2 class="fw-bold mb-4 text-center">Practice Mode</h2>
                
                <div id="practiceContainer" class="text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="assets/js/darkmode.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/bookmarks.js"></script>
    <script src="assets/js/loader.js"></script>
    <script src="assets/js/search.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('practiceContainer');
            let allQuestions = [];
            let currentIndex = 0;

            // Load all categories for practice mode
            for (const file of SearchManager.CATEGORIES) {
                const questions = await DataLoader.loadCategory(file);
                allQuestions = allQuestions.concat(questions);
            }

            // Shuffle array
            allQuestions.sort(() => 0.5 - Math.random());

            function renderPracticeQuestion(index) {
                if (allQuestions.length === 0) {
                    container.innerHTML = '<div class="alert alert-info">No questions available.</div>';
                    return;
                }

                if (index < 0) index = allQuestions.length - 1;
                if (index >= allQuestions.length) index = 0;
                
                currentIndex = index;
                const q = allQuestions[currentIndex];
                
                const html = `
                    <div class="practice-card animate-fade-in">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="badge bg-primary">${q.category}</span>
                            <span class="text-muted">Question ${currentIndex + 1} of ${allQuestions.length}</span>
                        </div>
                        <h3 class="mb-4">${DataLoader.escapeHtml(q.question)}</h3>
                        
                        <div id="answerSection" style="display: none;" class="text-start mt-4 animate-slide-up">
                            <hr class="border-secondary mb-4">
                            <h5>Answer:</h5>
                            <p>${DataLoader.escapeHtml(q.answer)}</p>
                            ${q.code ? `<div class="code-block"><pre><code>${DataLoader.escapeHtml(q.code)}</code></pre></div>` : ''}
                            ${q.output ? `<div class="output-block"><strong>Output:</strong><br><pre>${DataLoader.escapeHtml(q.output)}</pre></div>` : ''}
                        </div>

                        <div class="practice-controls mt-4">
                            <button class="btn btn-outline-secondary px-4" onclick="window.prevQuestion()">
                                <i class="bi bi-arrow-left"></i> Previous
                            </button>
                            <button class="btn btn-primary px-5" id="revealBtn" onclick="window.revealAnswer()">
                                <i class="bi bi-eye"></i> Reveal Answer
                            </button>
                            <button class="btn btn-outline-secondary px-4" onclick="window.nextQuestion()">
                                Next <i class="bi bi-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                `;
                
                container.innerHTML = html;
            }

            window.revealAnswer = function() {
                const answerSection = document.getElementById('answerSection');
                const revealBtn = document.getElementById('revealBtn');
                if (answerSection) {
                    answerSection.style.display = 'block';
                    revealBtn.style.display = 'none';
                }
            };

            window.nextQuestion = function() {
                renderPracticeQuestion(currentIndex + 1);
            };

            window.prevQuestion = function() {
                renderPracticeQuestion(currentIndex - 1);
            };

            renderPracticeQuestion(0);
        });
    </script>
</body>
</html>
